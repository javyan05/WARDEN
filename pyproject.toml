[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-scan"
version = "0.1.0"
description = "Shift-left security scanner for Infrastructure-as-Code and containers, with attack-chain correlation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Javier Rafu" }]
keywords = ["security", "devsecops", "iac", "terraform", "kubernetes", "docker", "sast", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "python-hcl2>=4.3",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/your-username/warden"
Issues = "https://github.com/your-username/warden/issues"

[project.scripts]
warden = "warden.cli:main"

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.setuptools.package-data]
warden = ["rules/builtin/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
